<!DOCTYPE html>
<div class="modal-overlay" id="zoomModal" style="display: none;">
    <div class="modal-card">
        <form onsubmit="saveZoomLink(event)">
            <div class="modal-header">
                <h2 class="modal-title"><i class="fas fa-video" style="margin-right: 10px;"></i> Kelola Link Zoom
                    Meeting</h2>
                <button type="button" class="modal-close" onclick="closeZoomModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="zoomStudentId">

                <!-- Info Mahasiswa -->
                <div class="pro-header-main" style="margin-bottom: 20px; align-items: center;">
                    <div class="pro-avatar" style="width: 45px; height: 45px; font-size: 20px;" id="zoomStudentAvatar">
                    </div>
                    <div>
                        <h3 class="pro-name" style="font-size: 18px; margin: 0;" id="zoomStudentName"></h3>
                        <p class="pro-meta" style="margin: 0;" id="zoomStudentNim"></p>
                    </div>
                </div>

                <!-- Input Link -->
                <div class="form-group">
                    <label for="zoomLinkInput" class="form-label">Link Meeting</label>
                    <div style="position: relative; display: flex; align-items: center;">
                        <i class="fas fa-link" style="position: absolute; left: 15px; color: #9ca3af;"></i>
                        <input type="url" id="zoomLinkInput" name="zoomLink" class="form-input"
                            placeholder="https://example.zoom.us/j/..." style="padding-left: 40px;" required>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeZoomModal()">Batal</button>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save" style="margin-right: 5px;"></i>
                    Simpan Link</button>
            </div>
        </form>
    </div>
</div>
